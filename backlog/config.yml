project_name: "AI Reality Town"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Blocked", "In Review", "Done"]
priorities: ["Critical", "High", "Medium", "Low"]
definition_of_done:
  - "All acceptance criteria are satisfied"
  - "Relevant automated tests are added or updated"
  - "Typecheck passes"
  - "Lint passes"
  - "Relevant tests pass"
  - "Build passes when applicable"
  - "No known regression is introduced"
  - "No secret or credential is committed"
  - "Documentation is updated"
  - "PRD traceability is updated when applicable"
  - "Implementation notes are complete"
  - "Final summary includes verification evidence"
  - "Changes are committed and pushed"
  - "Pull request is merged or explicitly blocked"
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vi"
auto_open_browser: false
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "ART"
