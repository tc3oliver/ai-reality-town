      The dynamic-view benchmark's sprite load probe (ART-173).

      NOT a product page and NOT part of any shipped build: `vite.config.ts` adds this input
      only when `VITE_E2E_FIXTURE === '1'`, which `npm run build` never sets. `benchEntry.test.ts`
      pins both halves of that.

      It renders the read-only world renderer alone, with N synthetic sprites, so NFR2-002 AC#4's
      renderer-capacity threshold can be measured at the twenty and forty visible characters
      FR-Q005 asks for. Mistwood has twelve residents; that is a fact about the world, not a limit
      on what the renderer must sustain.
    -->
