name: Bootstrap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-check:
    name: Autonomous control plane + offline quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap verification (agent:check)
        run: npm run agent:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
