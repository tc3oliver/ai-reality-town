name: Feature request
description: Suggest an idea for AI Reality Town
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Keep it aligned to the canon/proposal boundary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: layer
    attributes:
      label: Primary layer
      options:
        - Canon (events / validation / reducer / replay)
        - Simulation (provider / workflow)
        - Story / Recap projection
        - Presentation / UI
        - Tooling / CI / Docs
        - Other
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is within or adjacent to Phase 0 scope (see docs/foundation-scope.md), or a clearly justified extension.
          required: true
