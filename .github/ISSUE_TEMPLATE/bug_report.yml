name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal, self-contained reproduction steps.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant output. REDACT any secrets, keys, tokens, or URLs first.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. commit sha or branch"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, Convex deployment (do not paste secrets).
    validations:
      required: false
  - type: textarea
    id: canon-impact
    attributes:
      label: Canon / Replay impact
      description: Does this affect accepted events, the reducer, replay, or projections?
    validations:
      required: false
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Secret redaction
      options:
        - label: I have redacted all secrets, API keys, tokens, and deployment URLs from this report.
          required: true
